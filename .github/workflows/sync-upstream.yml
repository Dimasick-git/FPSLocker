name: Sync upstream (masagrator/FPSLocker)

# Pulls in changes from masagrator/FPSLocker, re-applies all Ryazhenka
# customisations via scripts/apply_ryazhenka_patches.sh, and opens a PR.
# Protected files (Makefile, .gitmodules, .github/, scripts/, README.md, etc.)
# are restored from the current Ryazhenka branch so the fork never breaks.

on:
  schedule:
    - cron: "17 4 * * 1"        # every Monday 04:17 UTC
  workflow_dispatch:
    inputs:
      upstream:
        description: "Upstream repo (owner/name)"
        required: false
        default: "masagrator/FPSLocker"
      upstream_branch:
        description: "Upstream branch"
        required: false
        default: "main"
      target_branch:
        description: "Local target branch the PR will merge into"
        required: false
        default: "main"

permissions:
  contents: write
  pull-requests: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  sync:
    runs-on: ubuntu-latest
    env:
      UPSTREAM_REPO: ${{ github.event.inputs.upstream || 'masagrator/FPSLocker' }}
      UPSTREAM_BRANCH: ${{ github.event.inputs.upstream_branch || 'main' }}
      TARGET_BRANCH: ${{ github.event.inputs.target_branch || 'main' }}
    steps:
      - name: Checkout local
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.inputs.target_branch || 'main' }}
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure git identity
        run: |
          git config user.name  "ryazhahand-sync-bot"
          git config user.email "ryazhahand-sync-bot@users.noreply.github.com"

      - name: Add upstream remote
        run: |
          git remote add upstream "https://github.com/${UPSTREAM_REPO}.git" || true
          git fetch upstream "${UPSTREAM_BRANCH}" --tags

      - name: Create sync branch
        id: branch
        run: |
          STAMP="$(date -u +%Y%m%d-%H%M%S)"
          BRANCH="sync/upstream-${STAMP}"
          git checkout -b "$BRANCH"
          echo "branch=$BRANCH" >> "$GITHUB_OUTPUT"

      - name: Merge upstream (favor upstream for conflicts, then re-protect)
        id: merge
        shell: bash
        run: |
          set +e
          git merge --no-ff --no-edit --allow-unrelated-histories \
            -X theirs "upstream/${UPSTREAM_BRANCH}"
          MERGE_RC=$?
          set -e
          echo "merge_rc=$MERGE_RC" >> "$GITHUB_OUTPUT"
          # Even on conflict (rc!=0), -X theirs usually resolves; if it did not,
          # mark unresolved files as theirs to keep moving — the protect step
          # below will restore everything that must stay Ryazhenka.
          if [ "$MERGE_RC" -ne 0 ]; then
            git diff --name-only --diff-filter=U | while read -r f; do
              git checkout --theirs -- "$f" || true
              git add -- "$f" || true
            done
            git commit --no-edit || true
          fi

      - name: Restore protected Ryazhenka files
        shell: bash
        run: |
          bash scripts/restore_protected.sh "${TARGET_BRANCH}"

      - name: Apply Ryazhenka patches (rename ultrahand -> ryazhahand, etc.)
        shell: bash
        run: |
          bash scripts/apply_ryazhenka_patches.sh

      - name: Commit re-application
        shell: bash
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            git add -A
            git commit -m "sync: re-apply Ryazhenka customisations after upstream merge"
          else
            echo "Nothing to re-apply."
          fi

      - name: Detect changes vs target
        id: diff
        shell: bash
        run: |
          if git diff --quiet "origin/${TARGET_BRANCH}" -- ; then
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
          else
            echo "has_changes=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Push sync branch
        if: steps.diff.outputs.has_changes == 'true'
        run: |
          git push -u origin "${{ steps.branch.outputs.branch }}"

      - name: Open Pull Request
        if: steps.diff.outputs.has_changes == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const branch = "${{ steps.branch.outputs.branch }}";
            const target = process.env.TARGET_BRANCH;
            const upstream = process.env.UPSTREAM_REPO;
            const upstreamBranch = process.env.UPSTREAM_BRANCH;
            const compareUrl =
              `https://github.com/${context.repo.owner}/${context.repo.repo}` +
              `/compare/${target}...${branch}?expand=1`;

            const title = `sync: pull upstream ${upstream}@${upstreamBranch}`;
            const body = [
              `Automated upstream sync from \`${upstream}\` (branch \`${upstreamBranch}\`).`,
              ``,
              `Steps executed:`,
              `1. Merged \`upstream/${upstreamBranch}\` with \`-X theirs\`.`,
              `2. Restored protected Ryazhenka files via \`scripts/restore_protected.sh\`.`,
              `3. Re-applied transformations via \`scripts/apply_ryazhenka_patches.sh\`.`,
              ``,
              `**Review carefully** — source/header changes from upstream may need manual adaptation`,
              `to the \`libryazhahand\` API surface.`,
            ].join("\n");

            async function summary(state, extraLine) {
              const lines = [
                `## ${state}`,
                ``,
                `- Sync branch: \`${branch}\` (already pushed to \`origin\`)`,
                `- Target branch: \`${target}\``,
                `- Upstream: \`${upstream}@${upstreamBranch}\``,
                `- Manual PR link: ${compareUrl}`,
              ];
              if (extraLine) lines.push("", extraLine);
              await core.summary.addRaw(lines.join("\n")).write();
            }

            // If a PR for this branch already exists, do nothing.
            const { data: prs } = await github.rest.pulls.list({
              owner: context.repo.owner,
              repo:  context.repo.repo,
              head:  `${context.repo.owner}:${branch}`,
              state: "open",
            });
            if (prs.length > 0) {
              core.info(`PR already open: ${prs[0].html_url}`);
              await summary("Sync ready — PR already open", `Existing PR: ${prs[0].html_url}`);
              return;
            }

            try {
              const { data: pr } = await github.rest.pulls.create({
                owner: context.repo.owner,
                repo:  context.repo.repo,
                head:  branch,
                base:  target,
                title,
                body,
              });
              core.info(`Created PR ${pr.html_url}`);
              await summary("Sync PR opened", `New PR: ${pr.html_url}`);
            } catch (err) {
              const blocked =
                err.status === 403 &&
                /not permitted to create or approve pull requests/i.test(err.message || "");
              if (!blocked) throw err;

              const note =
                `> :warning: \`GITHUB_TOKEN\` cannot create PRs in this repository.\n` +
                `> Open one manually via the link above, or enable the setting in:\n` +
                `> **Settings → Actions → General → Workflow permissions → "Allow GitHub Actions to create and approve pull requests"**.`;
              core.warning(
                "GITHUB_TOKEN is not permitted to create PRs. The sync branch was pushed; " +
                  "open the PR manually via " + compareUrl
              );
              await summary("Sync branch pushed — PR not opened (token has no PR-create permission)", note);
              // Do NOT fail the workflow — the branch is already on origin and reviewable.
            }
