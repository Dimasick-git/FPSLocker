name: Build FPSLocker

on:
  push:
    branches: [ "**" ]
    paths-ignore:
      - "README.md"
      - "docs/**"
      - ".github/ISSUE_TEMPLATE/**"
  pull_request:
    branches: [ "**" ]
  workflow_dispatch:

permissions:
  contents: write       # auto-release job updates the rolling `latest-build` release

env:
  # Opt in to Node.js 24 for actions/checkout, actions/upload-artifact, …
  # — silences the deprecation warning and aligns with the June 2026 default.
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  build:
    name: Build (devkitPro/devkita64)
    runs-on: ubuntu-latest
    container:
      image: devkitpro/devkita64:latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Mark workspace as safe
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Resolve commit metadata
        id: meta
        shell: bash
        run: |
          SHORT_SHA="$(git rev-parse --short=8 HEAD)"
          AUTHOR_NAME="$(git log -1 --pretty=format:'%an')"
          AUTHOR_EMAIL="$(git log -1 --pretty=format:'%ae')"
          COMMIT_SUBJECT="$(git log -1 --pretty=format:'%s')"
          COMMIT_DATE="$(git log -1 --pretty=format:'%cI')"
          APP_VERSION="$(grep -E '^APP_VERSION[[:space:]]*:=' Makefile | head -n1 | sed -E 's/.*:=[[:space:]]*//' | tr -d '\r')"
          {
            echo "short_sha=$SHORT_SHA"
            echo "author_name=$AUTHOR_NAME"
            echo "author_email=$AUTHOR_EMAIL"
            echo "commit_subject=$COMMIT_SUBJECT"
            echo "commit_date=$COMMIT_DATE"
            echo "app_version=$APP_VERSION"
          } >> "$GITHUB_OUTPUT"
          echo "==== BUILD META ===="
          echo "version : $APP_VERSION"
          echo "commit  : $SHORT_SHA  ($COMMIT_DATE)"
          echo "author  : $AUTHOR_NAME <$AUTHOR_EMAIL>"
          echo "subject : $COMMIT_SUBJECT"

      - name: Inject build metadata into APP_VERSION
        shell: bash
        run: |
          # Append short SHA to APP_VERSION so every artifact is traceable to a commit.
          BASE_VERSION="${{ steps.meta.outputs.app_version }}"
          SHORT_SHA="${{ steps.meta.outputs.short_sha }}"
          NEW_VERSION="${BASE_VERSION}+ryazh.${SHORT_SHA}"
          sed -i -E "s|^(APP_VERSION[[:space:]]*:=[[:space:]]*).*|\1${NEW_VERSION}|" Makefile
          echo "Patched APP_VERSION -> ${NEW_VERSION}"
          grep -E '^APP_VERSION' Makefile

      - name: Build .ovl
        shell: bash
        run: |
          # devkitpro/devkita64 image already exports DEVKITPRO, DEVKITA64, PATH
          # via ENV directives — no devkitvars.sh shim is needed. Just verify and
          # fall back to sourcing it if a future image stops exporting them.
          if [ -z "${DEVKITPRO:-}" ]; then
            for f in /opt/devkitpro/devkitvars.sh /etc/profile.d/devkit-env.sh; do
              if [ -f "$f" ]; then
                # shellcheck disable=SC1090
                . "$f"
                break
              fi
            done
          fi
          if [ -z "${DEVKITPRO:-}" ]; then
            export DEVKITPRO=/opt/devkitpro
          fi
          if [ -z "${DEVKITA64:-}" ] && [ -d "$DEVKITPRO/devkitA64" ]; then
            export DEVKITA64="$DEVKITPRO/devkitA64"
          fi
          export PATH="${DEVKITPRO:-/opt/devkitpro}/tools/bin:${DEVKITA64:-/opt/devkitpro/devkitA64}/bin:$PATH"
          echo "DEVKITPRO=$DEVKITPRO"
          echo "DEVKITA64=$DEVKITA64"
          which aarch64-none-elf-gcc || true
          make -j"$(nproc)"

      - name: Verify Ryazhahand signature
        shell: bash
        run: |
          if [ ! -f FPSLocker.ovl ]; then
            echo "::error::FPSLocker.ovl was not produced"
            exit 1
          fi
          SIG="$(tail -c 4 FPSLocker.ovl)"
          echo "Trailing signature: $SIG"
          if [ "$SIG" != "RYZH" ]; then
            echo "::error::Expected RYZH signature, got '$SIG'"
            exit 1
          fi

      - name: Stage artifact
        shell: bash
        run: |
          mkdir -p dist
          cp FPSLocker.ovl dist/FPSLocker.ovl
          cat > dist/BUILD_INFO.txt <<EOF
          FPSLocker (Ryazhenka / libryazhahand build)
          ===========================================
          Version        : ${{ steps.meta.outputs.app_version }}+ryazh.${{ steps.meta.outputs.short_sha }}
          Commit         : ${{ github.sha }}
          Short SHA      : ${{ steps.meta.outputs.short_sha }}
          Ref            : ${{ github.ref }}
          Author         : ${{ steps.meta.outputs.author_name }} <${{ steps.meta.outputs.author_email }}>
          Subject        : ${{ steps.meta.outputs.commit_subject }}
          Commit date    : ${{ steps.meta.outputs.commit_date }}
          Built by       : ${{ github.actor }}
          Workflow run   : ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          Repository     : ${{ github.server_url }}/${{ github.repository }}
          EOF
          echo "--- BUILD_INFO.txt ---"
          cat dist/BUILD_INFO.txt

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: FPSLocker-${{ steps.meta.outputs.short_sha }}
          path: |
            dist/FPSLocker.ovl
            dist/BUILD_INFO.txt
          if-no-files-found: error
          retention-days: 30

  auto-release:
    name: Auto-release latest main build
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (for release notes)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          pattern: FPSLocker-*
          path: artifact
          merge-multiple: true

      - name: Verify artifact
        shell: bash
        run: |
          ls -la artifact/
          test -f artifact/FPSLocker.ovl
          test -f artifact/BUILD_INFO.txt
          SIG="$(tail -c 4 artifact/FPSLocker.ovl)"
          echo "Trailing signature: $SIG"
          test "$SIG" = "RYZH"

      - name: Build release metadata
        id: meta
        shell: bash
        run: |
          SHORT_SHA="$(git rev-parse --short=8 HEAD)"
          BASE_VERSION="$(grep -E '^APP_VERSION[[:space:]]*:=' Makefile | head -n1 | sed -E 's/.*:=[[:space:]]*//' | tr -d '\r')"
          AUTHOR_NAME="$(git log -1 --pretty=format:'%an')"
          AUTHOR_EMAIL="$(git log -1 --pretty=format:'%ae')"
          COMMIT_SUBJECT="$(git log -1 --pretty=format:'%s')"
          COMMIT_DATE_UTC="$(git log -1 --pretty=format:'%cI')"
          {
            echo "short_sha=$SHORT_SHA"
            echo "base_version=$BASE_VERSION"
            echo "author_name=$AUTHOR_NAME"
            echo "author_email=$AUTHOR_EMAIL"
            echo "commit_subject=$COMMIT_SUBJECT"
            echo "commit_date_utc=$COMMIT_DATE_UTC"
          } >> "$GITHUB_OUTPUT"

      - name: Stage release assets
        shell: bash
        run: |
          mkdir -p release
          cp artifact/FPSLocker.ovl  release/FPSLocker.ovl
          cp artifact/BUILD_INFO.txt release/BUILD_INFO.txt
          cd release
          zip -9 "FPSLocker-latest-build.zip" FPSLocker.ovl BUILD_INFO.txt
          ls -la

      - name: Generate release notes
        shell: bash
        run: |
          PREV_TAG="$(git describe --tags --abbrev=0 --exclude='latest-build' --exclude='nightly' 2>/dev/null || true)"
          {
            echo "## Rolling pre-release — latest \`main\` build"
            echo ""
            echo "> **Этот релиз перезаписывается на каждый push в \`main\`.** Если нужна стабильная версия — берите релиз с тегом \`v*.*.*\`."
            echo ""
            echo "**Build info**"
            echo "- Base version: \`${{ steps.meta.outputs.base_version }}+ryazh.${{ steps.meta.outputs.short_sha }}\`"
            echo "- Commit: [\`${{ steps.meta.outputs.short_sha }}\`](${{ github.server_url }}/${{ github.repository }}/commit/${{ github.sha }})"
            echo "- Author: \`${{ steps.meta.outputs.author_name }} <${{ steps.meta.outputs.author_email }}>\`"
            echo "- Subject: ${{ steps.meta.outputs.commit_subject }}"
            echo "- Date: \`${{ steps.meta.outputs.commit_date_utc }}\`"
            echo "- Workflow: [run #${{ github.run_id }}](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})"
            echo "- Signature: \`RYZH\`"
            echo ""
            if [ -n "$PREV_TAG" ]; then
              echo "### Changes since \`$PREV_TAG\`"
              echo ""
              git log --pretty=format:'- %h %s' "$PREV_TAG..HEAD" | head -40
              echo ""
            fi
            echo ""
            echo "### Установка"
            echo "Скачайте \`FPSLocker.ovl\` и положите в \`/switch/.overlays/\` на SD-карте."
          } > release/NOTES.md
          cat release/NOTES.md

      - name: Move rolling tag to current commit
        shell: bash
        run: |
          git config user.name  "ryazhahand-release-bot"
          git config user.email "ryazhahand-release-bot@users.noreply.github.com"
          git tag -f latest-build
          git push -f origin refs/tags/latest-build

      - name: Publish / update rolling release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest-build
          name: "FPSLocker — latest main build (${{ steps.meta.outputs.short_sha }})"
          body_path: release/NOTES.md
          prerelease: true
          make_latest: "false"
          fail_on_unmatched_files: true
          files: |
            release/FPSLocker.ovl
            release/BUILD_INFO.txt
            release/FPSLocker-latest-build.zip
