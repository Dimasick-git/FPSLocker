name: Build FPSLocker

on:
  push:
    branches: [ "**" ]
    paths-ignore:
      - "README.md"
      - "docs/**"
      - ".github/ISSUE_TEMPLATE/**"
  pull_request:
    branches: [ "**" ]
  workflow_dispatch:

permissions:
  contents: write       # auto-release job updates the rolling `latest-build` release

env:
  # Opt in to Node.js 24 for actions/checkout, actions/upload-artifact, …
  # — silences the deprecation warning and aligns with the June 2026 default.
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  build:
    name: Build (devkitPro/devkita64)
    runs-on: ubuntu-latest
    container:
      image: devkitpro/devkita64:latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Mark workspace as safe
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Resolve commit metadata
        id: meta
        shell: bash
        run: |
          SHORT_SHA="$(git rev-parse --short=8 HEAD)"
          AUTHOR_NAME="$(git log -1 --pretty=format:'%an')"
          AUTHOR_EMAIL="$(git log -1 --pretty=format:'%ae')"
          COMMIT_SUBJECT="$(git log -1 --pretty=format:'%s')"
          COMMIT_DATE="$(git log -1 --pretty=format:'%cI')"
          APP_VERSION="$(grep -E '^APP_VERSION[[:space:]]*:=' Makefile | head -n1 | sed -E 's/.*:=[[:space:]]*//' | tr -d '\r')"
          {
            echo "short_sha=$SHORT_SHA"
            echo "author_name=$AUTHOR_NAME"
            echo "author_email=$AUTHOR_EMAIL"
            echo "commit_subject=$COMMIT_SUBJECT"
            echo "commit_date=$COMMIT_DATE"
            echo "app_version=$APP_VERSION"
          } >> "$GITHUB_OUTPUT"
          echo "==== BUILD META ===="
          echo "version : $APP_VERSION"
          echo "commit  : $SHORT_SHA  ($COMMIT_DATE)"
          echo "author  : $AUTHOR_NAME <$AUTHOR_EMAIL>"
          echo "subject : $COMMIT_SUBJECT"

      - name: Inject build metadata into APP_VERSION
        shell: bash
        run: |
          # Append short SHA to APP_VERSION so every artifact is traceable to a commit.
          BASE_VERSION="${{ steps.meta.outputs.app_version }}"
          SHORT_SHA="${{ steps.meta.outputs.short_sha }}"
          NEW_VERSION="${BASE_VERSION}+ryazh.${SHORT_SHA}"
          sed -i -E "s|^(APP_VERSION[[:space:]]*:=[[:space:]]*).*|\1${NEW_VERSION}|" Makefile
          echo "Patched APP_VERSION -> ${NEW_VERSION}"
          grep -E '^APP_VERSION' Makefile

      - name: Build .ovl
        shell: bash
        run: |
          # devkitpro/devkita64 image already exports DEVKITPRO, DEVKITA64, PATH
          # via ENV directives — no devkitvars.sh shim is needed. Just verify and
          # fall back to sourcing it if a future image stops exporting them.
          if [ -z "${DEVKITPRO:-}" ]; then
            for f in /opt/devkitpro/devkitvars.sh /etc/profile.d/devkit-env.sh; do
              if [ -f "$f" ]; then
                # shellcheck disable=SC1090
                . "$f"
                break
              fi
            done
          fi
          if [ -z "${DEVKITPRO:-}" ]; then
            export DEVKITPRO=/opt/devkitpro
          fi
          if [ -z "${DEVKITA64:-}" ] && [ -d "$DEVKITPRO/devkitA64" ]; then
            export DEVKITA64="$DEVKITPRO/devkitA64"
          fi
          export PATH="${DEVKITPRO:-/opt/devkitpro}/tools/bin:${DEVKITA64:-/opt/devkitpro/devkitA64}/bin:$PATH"
          echo "DEVKITPRO=$DEVKITPRO"
          echo "DEVKITA64=$DEVKITA64"
          which aarch64-none-elf-gcc || true
          make -j"$(nproc)"

      - name: Verify Ryazhahand signature
        shell: bash
        run: |
          if [ ! -f FPSLocker.ovl ]; then
            echo "::error::FPSLocker.ovl was not produced"
            exit 1
          fi
          SIG="$(tail -c 4 FPSLocker.ovl)"
          echo "Trailing signature: $SIG"
          if [ "$SIG" != "RYZH" ]; then
            echo "::error::Expected RYZH signature, got '$SIG'"
            exit 1
          fi

      - name: Stage artifact
        shell: bash
        run: |
          mkdir -p dist
          cp FPSLocker.ovl dist/FPSLocker.ovl
          # BUILD_INFO.txt is for traceability inside the CI artifact / zip only —
          # it is NOT published as a separate file in the release. Author is
          # forced to Dimasick-git regardless of which contributor signed the commit.
          cat > dist/BUILD_INFO.txt <<EOF
          FPSLocker (Ryazhenka / libryazhahand build)
          ===========================================
          Version        : ${{ steps.meta.outputs.app_version }}+ryazh.${{ steps.meta.outputs.short_sha }}
          Commit         : ${{ github.sha }}
          Short SHA      : ${{ steps.meta.outputs.short_sha }}
          Ref            : ${{ github.ref }}
          Author         : Dimasick-git
          Commit author  : ${{ steps.meta.outputs.author_name }} <${{ steps.meta.outputs.author_email }}>
          Subject        : ${{ steps.meta.outputs.commit_subject }}
          Commit date    : ${{ steps.meta.outputs.commit_date }}
          Built by       : ${{ github.actor }}
          Workflow run   : ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          Repository     : ${{ github.server_url }}/${{ github.repository }}
          EOF
          echo "--- BUILD_INFO.txt ---"
          cat dist/BUILD_INFO.txt

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: FPSLocker-${{ steps.meta.outputs.short_sha }}
          path: |
            dist/FPSLocker.ovl
            dist/BUILD_INFO.txt
          if-no-files-found: error
          retention-days: 30

  auto-tag-on-version-change:
    name: Auto-tag if APP_VERSION changed (triggers release.yml)
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Compare APP_VERSION with latest release tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          APP_VERSION=$(grep -E '^APP_VERSION\s*:=' Makefile | sed -E 's/.*:=\s*//;s/\s*$//')
          if [ -z "$APP_VERSION" ]; then
            echo "::error::Could not extract APP_VERSION from Makefile."
            exit 1
          fi
          TAG="v${APP_VERSION}"
          LATEST=$(gh release list --repo "${{ github.repository }}" --limit 5 --json tagName --jq '.[] | .tagName' | grep -E '^v[0-9]' | head -1 || echo "")
          echo "APP_VERSION=$APP_VERSION  ->  TAG=$TAG"
          echo "Latest release tag: $LATEST"
          if [ "$TAG" = "$LATEST" ]; then
            echo "Already released; nothing to do."
            exit 0
          fi
          if gh release view "$TAG" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            echo "Tag $TAG already has a release; nothing to do."
            exit 0
          fi
          if git rev-parse "refs/tags/$TAG" >/dev/null 2>&1; then
            echo "Tag exists but no release; pushing to (re-)trigger release.yml."
            git push origin "$TAG" || true
          else
            git config user.name  'ryazhahand-release-bot'
            git config user.email 'ryazhahand-release-bot@users.noreply.github.com'
            git tag -a "$TAG" -m "Auto-tag on APP_VERSION change: $TAG"
            git push origin "$TAG"
            echo "Pushed $TAG — release.yml will publish."
          fi

