name: Build & Release

defaults:
  run:
    shell: bash

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:

permissions:
  contents: write

concurrency:
  group: build-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    container: devkitpro/devkita64:latest

    steps:
      - name: Install 7z
        run: apt-get update -qq && apt-get install -y p7zip-full

      - name: Checkout (with submodules)
        uses: actions/checkout@v7
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Fix git safe.directory
        run: git config --global --add safe.directory '*'

      - name: Build libnx with HOS 23 APIs
        run: |
          git clone https://github.com/switchbrew/libnx.git "$RUNNER_TEMP/libnx"
          git -C "$RUNNER_TEMP/libnx" checkout --detach feebd026ca0f5dcc2119f46ad8e0d16ad3dd4973
          make -C "$RUNNER_TEMP/libnx" -j"$(nproc)"
          make -C "$RUNNER_TEMP/libnx" install
          "$DEVKITPRO/devkitA64/bin/aarch64-none-elf-gcc" --version

      - name: Build and verify overlay
        run: |
          make -j"$(nproc)"
          python3 - <<'PY'
          from pathlib import Path
          data = Path('FPSLocker.ovl').read_bytes()
          assert data[16:20] == b'NRO0'
          assert data[-4:] == b'RYZH'
          PY
          mkdir -p dist/sd-root/switch/.overlays
          cp FPSLocker.ovl dist/sd-root/switch/.overlays/
          cd dist/sd-root
          7z a ../FPSLocker.zip ./switch

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: FPSLocker
          path: dist/FPSLocker.zip
          if-no-files-found: error

  validate-patches:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Build upstream patch validators
        env:
          SALTYNX_REF: '2.1.1'
        run: python3 tester/run.py
      - name: Validate AArch32 and AArch64 game patches against SaltyNX
        run: |
          git clone --branch v4 https://github.com/masagrator/FPSLocker-Warehouse.git "$RUNNER_TEMP/warehouse"
          git -C "$RUNNER_TEMP/warehouse" checkout --detach f681828803dd0d58c43915519015e7e3d4a2ea57
          cd tester
          ./my_program -v "$RUNNER_TEMP/warehouse/SaltySD/plugins/FPSLocker/patches/0100A9400C9C2000/33463E11899166BB.yaml"
          ./my_program -v "$RUNNER_TEMP/warehouse/SaltySD/plugins/FPSLocker/patches/010000B0196AA000/005CB235608DCEDD.yaml"

  release:
    name: Publish release
    needs: [build, validate-patches]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Download artifact
        uses: actions/download-artifact@v8
        with:
          name: FPSLocker

      - name: Resolve tag
        id: tag
        run: echo "tag=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"

      - name: Publish release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: FPSLocker ${{ steps.tag.outputs.tag }}
          generate_release_notes: false
          body: |
            Новшества FPSLocker 3.5.0, компактный интерфейс и новая libryazhahand. Для тройной буферизации нужен SaltyNX 2.1.0+.
          files: FPSLocker.zip
          fail_on_unmatched_files: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
